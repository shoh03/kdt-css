<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 선택자(id)</title>
    <style>
        #title {
            border: 2px solid black;
            /* 
                인라인 요소의 특징 - 크기를 지정할 수 없음 -> 지정하려면 display 속성을 block으로 바꿔야함
            */
            display: block;
            width: 200px;
            height: 200px;
            color: white;
            background: blue;
        }
    </style>
</head>
<body>
    <strong id="title">아이디 선택자</strong>
    <p>
        아이디는 웹 문서에 딱 하나먼 존재하는 선택자이다.
        아이디 선택자의 기호는 <q>#</q>을 사용한다.
    </p>
    <h3>예를 들어 아이디가 test라면 선택자는 #test이다.</h3>
</body>
</html>
